name: Publish npm

on:
  push:
    branches:
      - main
  workflow_dispatch:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.event_name }}-${{ github.ref || github.run_id }}
  cancel-in-progress: false

jobs:
  publish-dev:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify install and lockfile stability
        run: |
          test -d node_modules
          git diff --exit-code -- pnpm-lock.yaml

      - name: Registry neutrality
        run: pnpm run check:registry

      - name: Run tests
        run: pnpm test

      - name: Resolve dev version
        id: version
        run: |
          base_version="$(node -p "require('./package.json').version")"
          dev_version="${base_version}-dev.${{ github.run_number }}"
          echo "version=${dev_version}" >> "$GITHUB_OUTPUT"
          echo "Resolved dev version: ${dev_version}"

      - name: Stamp dev version
        env:
          DEV_VERSION: ${{ steps.version.outputs.version }}
        run: npm version --no-git-tag-version --allow-same-version "$DEV_VERSION"

      - name: Build package
        run: pnpm run build

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Publish dev version to npm
        env:
          NPM_CONFIG_PROVENANCE: "true"
        run: npm publish --tag dev --access public --provenance

  publish-release:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'release' && github.event.action == 'published' && !github.event.release.prerelease && !github.event.release.draft)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify install and lockfile stability
        run: |
          test -d node_modules
          git diff --exit-code -- pnpm-lock.yaml

      - name: Registry neutrality
        run: pnpm run check:registry

      - name: Run tests
        run: pnpm test

      - name: Resolve release version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          if [ -z "$version" ] || [ "$version" = "$RELEASE_TAG" ]; then
            version="$(node -p "require('./package.json').version")"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Resolved release version: ${version}"

      - name: Stamp release version
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: npm version --no-git-tag-version --allow-same-version "$RELEASE_VERSION"

      - name: Build package
        run: pnpm run build

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Publish to npm
        env:
          NPM_CONFIG_PROVENANCE: "true"
        run: npm publish --access public --provenance
